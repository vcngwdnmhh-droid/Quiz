<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Quiz-Arena</title>
<style>
:root{--bg:#0f1020;--p:#1a1c36;--p2:#26294d;--line:rgba(255,255,255,.09);--t:#eef0ff;--mut:#a3a8d1;--acc:#8b5cf6;--acc2:#22d3ee;--good:#22c55e;--bad:#ef4444;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,#2b2160,var(--bg) 60%) fixed;color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:12px 14px 30px;padding-top:max(12px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h2{flex:1;margin:0;font-size:19px}
.chip{background:var(--p2);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.back{background:var(--p2);border:0;border-radius:12px;width:40px;height:40px;font-size:18px}
.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}.pos{color:var(--good)}.neg{color:var(--bad)}.gold{color:var(--gold)}
.sm{font-size:13px}.xs{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 0 #4c1d95}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4c1d95}
.btn.alt{background:var(--p2);box-shadow:0 4px 0 #15173a}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#d97706);color:#2a1700;box-shadow:0 4px 0 #92400e}
.btn.s{padding:7px 11px;font-size:13px;border-radius:11px;box-shadow:0 3px 0 #15173a}
.btn:disabled{opacity:.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:0;border-radius:18px;padding:14px 12px;text-align:left;color:#fff;min-height:104px;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.mode b{display:block;font-size:16px;margin-top:4px}.mode span{font-size:11.5px;opacity:.9;display:block;margin-top:2px}
.mode i{font-style:normal;font-size:28px}
.mode .badge{position:absolute;top:8px;right:9px;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 6px;font-size:10.5px;font-weight:800}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cat{border:0;border-radius:16px;padding:12px;text-align:left;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cat i{font-style:normal;font-size:24px}.cat b{display:block;font-size:14px;margin-top:2px}.cat span{font-size:11px;opacity:.85}
.prof{display:flex;align-items:center;gap:12px}
.ava{width:56px;height:56px;border-radius:18px;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.bar{height:9px;background:#2d3061;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px;transition:width .25s}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qcard{background:linear-gradient(160deg,#272a57,#1b1d3b);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:12px;min-height:130px;display:flex;flex-direction:column;justify-content:center;animation:pop .3s ease}
.qcard .ct{font-size:12px;font-weight:800;opacity:.85;margin-bottom:6px}
.qcard .q{font-size:20px;font-weight:800;line-height:1.3}
@keyframes pop{from{transform:scale(.96);opacity:.3}}
.ans{display:grid;gap:9px}
.a{background:var(--p2);border:2px solid transparent;border-radius:16px;padding:14px 14px;text-align:left;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 #15173a;transition:background .15s}
.a .l{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.a.ok{background:#15803d;border-color:#4ade80;animation:yes .4s}
.a.no{background:#991b1b;border-color:#f87171;animation:shake .4s}
.a.lock{background:#b45309;border-color:#fbbf24}
.a.gone{opacity:.15;pointer-events:none}
.a:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes yes{50%{transform:scale(1.03)}}
.timer{height:10px;background:#2d3061;border-radius:6px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:6px}
.timer.warn i{background:linear-gradient(90deg,#ef4444,#f97316)}
.jokers{display:flex;gap:8px;margin-top:12px;justify-content:center}
.jk{background:var(--p2);border:0;border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #15173a}
.jk:disabled{opacity:.3}
.info{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:9px 12px;margin-top:10px;font-size:13.5px;animation:pop .3s}
.ladder{display:flex;flex-direction:column-reverse;gap:2px;font-size:12px}
.ladder div{display:flex;justify-content:space-between;padding:2px 10px;border-radius:8px}
.ladder .cur{background:var(--acc);font-weight:800}
.ladder .safe{color:var(--gold);font-weight:800}
.ladder .done{opacity:.45}
.big{font-size:42px;font-weight:900;text-align:center;margin:6px 0}
.stars{font-size:30px;text-align:center;letter-spacing:4px}
.it{border-top:1px solid var(--line);padding:8px 0}.it:first-of-type{border-top:0}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ach i{font-style:normal;font-size:26px;width:38px;text-align:center}.ach.lock{opacity:.35;filter:grayscale(1)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#24275a;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .3s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.pl{display:flex;gap:6px;align-items:center;background:var(--p2);border-radius:12px;padding:7px 10px;font-weight:800}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:10px}
.vs .s{font-size:26px;font-weight:900}
input.txt{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--t);font:inherit;width:100%;user-select:text;-webkit-user-select:text}
.pubbar{display:flex;align-items:flex-end;gap:12px;height:110px;justify-content:center;margin-top:8px}
.pubbar div{width:44px;background:linear-gradient(#22d3ee,#6366f1);border-radius:8px 8px 0 0;position:relative}
.pubbar div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:800}
.pubbar div b{position:absolute;bottom:-20px;left:0;right:0;text-align:center}
body.light{--p:#ffffff;--p2:#eceefa;--line:rgba(20,20,60,.12);--t:#1a1c36;--mut:#5b6080}
body.light .qcard{background:linear-gradient(160deg,#ffffff,#eef0fb)}
body.light .a{box-shadow:0 4px 0 #cdd1ec}body.light .btn.alt,body.light .jk{box-shadow:0 4px 0 #cdd1ec}body.light .btn.alt{color:#1a1c36}
body.light .timer,body.light .bar{background:#dde0f3}body.light .a.ok,body.light .a.no,body.light .a.lock{color:#fff}
body.light .tst{background:#fff;color:#1a1c36}body.light .chip{color:#1a1c36}
body.anim::before{content:'';position:fixed;inset:-40%;background:radial-gradient(circle at 30% 30%,var(--acc) 0,transparent 22%),radial-gradient(circle at 70% 65%,var(--acc2) 0,transparent 22%),radial-gradient(circle at 40% 80%,var(--acc) 0,transparent 18%);opacity:.16;animation:drift 26s linear infinite;z-index:-1;pointer-events:none}
@keyframes drift{to{transform:rotate(360deg)}}
.wheelwrap{position:relative;width:300px;height:300px;margin:0 auto}
.wheelwrap .ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}

let AC=null;function sfx(t){if(!P.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const n=AC.currentTime;
 const seq={ok:[[660,0],[880,.08]],no:[[220,0],[160,.12]],tick:[[1000,0]],win:[[523,0],[659,.1],[784,.2],[1047,.3]],lock:[[440,0]]}[t]||[[440,0]];o.type=t==='no'?'sawtooth':'sine';
 g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(t==='tick'?.05:.15,n+.02);seq.forEach(([f,d])=>o.frequency.setValueAtTime(f,n+d));const end=n+seq[seq.length-1][1]+.18;g.gain.exponentialRampToValueAtTime(.0001,end);o.start(n);o.stop(end+.02)}catch(e){}}

let parts=[];function confetti(n=120){const cv=$('fx');cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,c:`hsl(${Math.random()*360},90%,60%)`,l:120+Math.random()*60,r:Math.random()*6});if(parts.length===n)requestAnimationFrame(fxLoop)}
function fxLoop(){const cv=$('fx'),g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.l--;p.r+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-4,-2,8,4);g.restore()});parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);if(parts.length)requestAnimationFrame(fxLoop);else g.clearRect(0,0,cv.width,cv.height)}

/* ====================== Fragen ziehen ====================== */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(n,{cat=null,d=null,excl=[],r=Math.random,types=null,mixWrong=true}={}){const base=Q.filter(q=>!P.hidden[q.id]&&(!cat||q.cat===cat)&&(!d||d.includes(q.d))&&!excl.includes(q.id)&&(!types||types.includes(q.type)));
 let out=[];if(mixWrong&&r===Math.random){const recent=P.seen.slice(-20);const wr=base.filter(q=>P.wrong[q.id]&&!recent.includes(q.id));out=shuffle([...wr]).slice(0,Math.min(Math.floor(n*.25),wr.length))}
 let pool=base.filter(q=>!out.includes(q));const fresh=pool.filter(q=>!P.seen.includes(q.id));if(fresh.length>=n-out.length)pool=fresh;return shuffle([...out,...shuffle([...pool],r).slice(0,n-out.length)],r)}
function prep(q,r=Math.random){if(q.type==='multi'){const all=shuffle([...q.right.map(t=>[t,1]),...q.wrong.map(t=>[t,0])],r);return{...q,opts:all.map(x=>x[0]),okSet:all.map((x,i)=>x[1]?i:-1).filter(i=>i>=0)}}if(q.type==='gap'||q.type==='num')return{...q};if(q.type==='tf')return{...q,opts:['✔ Wahr','✘ Falsch'],ok:q.tf?0:1};if(q.type==='est')return{...q};if(q.type==='ord')return{...q,disp:shuffle([0,1,2,3].slice(0,q.items.length),r)};
 const order=shuffle([0,1,2,3],r);return{...q,opts:order.map(i=>q.a[i]),ok:order.indexOf(0)}}

function stepOf(q){return Number.isInteger(q.ans)&&Number.isInteger(q.tol)?((q.max-q.min)>2000?10:1):0.05}

  return`<div class="card" style="text-align:center"><input class="txt" id="${k==='gap'?'gi':'ni'}" ${k==='num'?'type="number" inputmode="numeric"':'type="text" autocomplete="off" autocapitalize="off" spellcheck="false"'} placeholder="${k==='gap'?'Antwort eintippen…':'Zahl eintippen…'}" style="font-size:20px;text-align:center" onkeydown="if(event.key==='Enter')dispatchAns('${act}','${k}')">${hint}

 if(q.type==='est'){const mid=Math.round(((q.min+q.max)/2)/stepOf(q))*stepOf(q);return`<div class="card" style="text-align:center"><div class="big" id="ev" style="font-size:36px">${fmtN(mid)} <span style="font-size:18px">${esc(q.unit)}</span></div>

  <button class="btn" style="width:100%;margin-top:10px" id="eb" data-a="${act}|est">🎯 Tipp abgeben</button><div id="res"></div></div>`}
 if(q.type==='ord'){G.ordSel=[];G.ordAct=act;return`<div class="xs mut" style="margin-bottom:6px">Tippe die Antworten in der richtigen Reihenfolge an:</div><div class="ans">${q.disp.map(i=>`<button class="a" id="o${i}" data-a="ordp|${i}"><span class="l" id="ol${i}">?</span>${esc(q.items[i])}</button>`).join('')}</div><button class="btn alt s" style="margin-top:8px" data-a="ordr">↺ Neu sortieren</button><div id="res"></div>`}
 return`<div class="ans" ${q.type==='tf'?'style="grid-template-columns:1fr 1fr"':''}>${q.opts.map((o,i)=>`<button class="a" id="a${i}" data-a="${act}|${i}" ${q.type==='tf'?'style="justify-content:center;font-size:18px;padding:20px"':''}>${q.type==='tf'?'':`<span class="l">${'ABCD'[i]}</span>`}${esc(o)}</button>`).join('')}</div>`}
function estUpd(){const q=curQ();if(!q||!$('er'))return;$('ev').innerHTML=`${fmtN($('er').value)} <span style="font-size:18px">${esc(q.unit)}</span>`}
function curQ(){if(!G||!G.qs)return null;return G.mode==='party'?G.qs[G.turn]:G.qs[G.i]}
function readVal(q,raw){if(raw==='gap')return($('gi')&&$('gi').value)||'';if(raw==='num'){const v=$('ni')&&$('ni').value;return v===''||v==null?'':parseFloat(String(v).replace(',','.'))}if(raw==='multi')return[...G.msel].sort((a,b)=>a-b);if(raw==='est')return parseFloat($('er').value);if(raw==='ord')return G.ordSel.slice();return +raw}
function norm(t){return String(t).toLowerCase().trim().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.,!?„“"'’]/g,'').replace(/\s+/g,' ')}
function isRight(q,v){if(v==null||v===-1)return false;if(q.type==='gap')return v!==''&&q.ans.some(a=>norm(a)===norm(v));if(q.type==='num')return v!==''&&+v===q.ans;if(q.type==='multi')return Array.isArray(v)&&v.length===q.okSet.length&&v.every((x,i)=>x===q.okSet[i]);if(q.type==='est')return Math.abs(v-q.ans)<=q.tol+1e-9;if(q.type==='ord')return Array.isArray(v)&&v.length===q.items.length&&v.every((x,i)=>x===i);return v===q.ok}
function corrText(q){if(q.type==='gap')return q.ans[0];if(q.type==='num')return String(q.ans);if(q.type==='multi')return q.right.join(', ');if(q.type==='tf')return q.tf?'Wahr':'Falsch';if(q.type==='est')return fmtN(q.ans)+' '+q.unit;if(q.type==='ord')return q.items.join(' → ');return q.a[0]}
function ansText(q,v){if(v==null||v===-1||v===''||(Array.isArray(v)&&!v.length))return null;if(q.type==='gap'||q.type==='num')return String(v);if(q.type==='multi')return v.map(i=>q.opts[i]).join(', ');if(q.type==='est')return fmtN(v)+' '+q.unit;if(q.type==='ord')return v.map(i=>q.items[i]).join(' → ');return q.opts[v]}
function markAns(q,v,right){

 if(q.type==='multi'){if($('eb'))$('eb').disabled=true;q.opts.forEach((_,i)=>{const b=$('m'+i);if(!b)return;b.disabled=true;const ok=q.okSet.includes(i),sel=(v||[]).includes(i);if(ok&&sel)b.classList.add('ok');else if(!ok&&sel)b.classList.add('no');else if(ok)b.style.borderColor='#4ade80'});const r=$('res');if(r&&!right)r.innerHTML=`<div class="info">Richtig wären: <b>${q.right.map(esc).join(', ')}</b></div>`;return}

 if(q.type==='ord'){document.querySelectorAll('[data-a^="ordp"],[data-a="ordr"]').forEach(b=>b.disabled=true);(v||[]).forEach((x,i)=>{const b=$('o'+x);if(b)b.classList.add(x===i?'ok':'no')});const r=$('res');if(r&&!right)r.innerHTML=`<div class="info">Richtige Reihenfolge: <b>${q.items.map(esc).join(' → ')}</b></div>`;return}
 document.querySelectorAll('.a').forEach(b=>b.disabled=true);$('a'+q.ok).classList.add('ok');if(v>=0&&v!==q.ok&&$('a'+v))$('a'+v).classList.add('no')}

function startGame(mode,cat){P.games++;

 case'quit':{if(ON){leaveOnline();break}if(!G||G.mode==='done'){home();break}const af=$('after');if(af&&!$('qbox')){af.insertAdjacentHTML('afterbegin','<div class="card" id="qbox" style="margin-top:10px;text-align:center"><b>Runde wirklich abbrechen?</b><div class="row" style="justify-content:center;margin-top:8px"><button class="btn s" data-a="quitok">Ja, abbrechen</button><button class="btn alt s" data-a="quitno">Weiterspielen</button></div></div>');$('qbox').scrollIntoView({behavior:'smooth',block:'center'})}else if(!af){stopTimer();G=null;home()}break}
 case'quitok':stopTimer();G=null;home();break;
 case'quitno':{const q=$('qbox');if(q)q.remove();break}
 case'mans':millAns(+p[1]);break;
 case'mj':millJoker(p[1]);break;
 case'mnext':G.i++;G.rem=null;showMill();break;
 case'mend':endMill(safeWin(),false);break;
 case'mquit':endMill(LADDER[G.i-1],false);break;
 case'duel':startDuel(p[1]);break;

 case'dans':duelAns(p[1]);break;

 case'padd':readParty();P.party.push('Spieler '+(P.party.length+1));partyMenu();break;

 case'stats':stats();break;
 case'achs':achs();break;
 case'shop':shop();break;
 case'settings':settings();break;
 case'buyjk':{const k=p[1],cost=+p[2];if(P.coins>=cost){P.coins-=cost;P.jk[k]++;save();sfx('ok')}shop();break}
 case'ava':{const a=p[1],cost=+p[2];if(!P.owned.ava.includes(a)){if(P.coins<cost)break;P.coins-=cost;P.owned.ava.push(a)}P.ava=a;save();shop();break}
 case'theme':{const k=p[1];if(!P.owned.theme.includes(k)){if(P.coins<300)break;P.coins-=300;P.owned.theme.push(k)}P.theme=k;applyTheme();save();shop();break}
 case'setname':P.name=$('nm').value.trim();save();toast('Gespeichert!');break;
 case'sound':P.sound=!P.sound;save();settings();break;
 case'resetask':b.outerHTML='<button class="btn s" style="background:#b91c1c" data-a="resetok">Ja, wirklich alles löschen</button>';break;
 case'resetok':P=newProfile();save();applyTheme();home();toast('Zurückgesetzt.');break;
 }});
