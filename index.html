function isRight(q,v){if(v==null||v===-1)return false;if(q.type==='gap')return v!==''&&q.ans.some(a=>norm(a)===norm(v));if(q.type==='num')return v!==''&&+v===q.ans;if(q.type==='multi')return Array.isArray(v)&&v.length===q.okSet.length&&v.every((x,i)=>x===q.okSet[i]);if(q.type==='est')return Math.abs(v-q.ans)<=q.tol+1e-9;if(q.type==='ord')return Array.isArray(v)&&v.length===q.items.length&&v.every((x,i)=>x===i);return v===q.ok}

function qTotal(){return ON.cfg.mode==='ko'?60:ON.cfg.n}

 if(ON.cfg.mode==='mill'){millStart();return}
 if(ON.cfg.mode==='poker'){pkStart();return}
 if(GSTART[ON.cfg.mode]){GSTART[ON.cfg.mode]();return}
 if(!OTYPES.some(t=>ON.cfg.types[t[0]]))ON.cfg.types.mc=true;
 ON.qi=-1;ON.used=[];ON.usedA=[];ON.curCat=ON.cfg.catm==='host'?ON.cfg.cat:'mix';ON.players.forEach(resetP);

 ON.qi++;if(ON.qi>=qTotal()){hostEnd();return}
 if(ON.cfg.catm!=='host'&&ON.qi%3===0){if(ON.cfg.catm==='wheel')hostWheel();else hostVote()}else afterCat()}

function pickKind(){const k=OTYPES.map(t=>t[0]).filter(t=>ON.cfg.types[t]);return k.length?k[rint(0,k.length-1)]:'mc'}
function pickQ(){const kind=pickKind();const d=ON.cfg.diff==='mix'?null:[+ON.cfg.diff];
 if(kind==='who'){const pool=WHOQ.filter(w=>!d||d.includes(w.d));const w=oFresh(pool)||oFresh(WHOQ)||WHOQ[rint(0,WHOQ.length-1)];const order=shuffle([0,1,2,3]);
  return{id:w.id,type:'who',q:'Wer bin ich?',clues:w.clues,opts:order.map(i=>w.a[i]),ok:order.indexOf(0),cat:'allg',d:w.d,info:'',_ak:akey(w)}}
 const types=kind==='mc'?['mc','emo','flag']:[kind];const cat=ON.curCat==='mix'?null:ON.curCat;
 const base=Q.filter(q=>!P.hidden[q.id]&&types.includes(q.type)&&(!cat||q.cat===cat));
 const r=oFresh(base.filter(q=>!d||d.includes(q.d)))||oFresh(base)||oFresh(Q.filter(q=>QUICKT.includes(q.type)&&(!cat||q.cat===cat)))||oFresh(Q.filter(q=>QUICKT.includes(q.type)));
 const q=prep(r);q._ak=akey(r);markSeen(q.id);return q}

 const base=q.type==='who'?Math.max(ON.cfg.t,20):q.type==='est'?Math.max(ON.cfg.t,15):ON.cfg.t;ON.dur=ON.cfg.mode==='turbo'?Math.max(6,Math.round(base/2)):base;

function hostJoker(p,k,i){if(!ON||!ON.cfg.jok||ON.state!=='q'||i!==ON.qi||p.out||!p.jk||!(p.jk[k]>0))return;const q=ON.cq;
 if(k==='fifty'){if(!['mc','emo','flag','who'].includes(q.type))return;p.jk.fifty--;const rm=shuffle(q.opts.map((_,j)=>j).filter(j=>j!==q.ok)).slice(0,2);sendTo(p.id,{t:'fifty',rm})}

function rankOrder(arr){const ko=(ON.cfg||{}).mode==='ko';return[...arr].sort((a,b)=>ko&&a.out!==b.out?(a.out?1:-1):ko&&a.out&&b.outAt!==b.outAt?b.outAt-a.outAt:b.score-a.score)}

function hostReveal(){if(!ON||ON.state!=='q')return;clearT();ON.state='rev';const q=ON.cq,c=ON.cfg;const mult=(c.mode==='turbo'?1.5:1)*(ON.fin?2:1);
 const before=rankOrder(ON.players).map(p=>p.id),picks={};let closest=[];
 if(q.type==='est'){const errs=ON.players.filter(p=>!p.out&&ON.ans[p.id]).map(p=>Math.abs(ON.ans[p.id].v-q.ans));const mn=errs.length?Math.min(...errs):null;closest=ON.players.filter(p=>!p.out&&ON.ans[p.id]&&Math.abs(ON.ans[p.id].v-q.ans)===mn).map(p=>p.id)}
 ON.players.forEach(p=>{if(p.out){p.last=null;return}const a=ON.ans[p.id];const v=a?a.v:-1;if(a)picks[p.id]=v;let right=false,pts=0,bonus=0,bet=0;
  if(q.type==='est'){if(a){const err=Math.abs(v-q.ans);right=err<=q.tol+1e-9||closest.includes(p.id);pts=Math.round(1000*Math.max(0,1-err/((q.max-q.min)/4)));if(closest.includes(p.id))pts+=200}}
  else{right=!!a&&v===q.ok;if(right){if(q.type==='who'){const k=Math.min(4,Math.floor(a.ms/(ON.dur*1000/4))+1);pts=(5-k)*250}else pts=c.speed?Math.round(500+500*Math.max(0,1-a.ms/(ON.dur*1000))):1000}}
  pts=Math.round(pts*mult);if(right&&p.dbl===ON.qi)pts*=2;
  if(right){p.st++;p.best=Math.max(p.best,p.st);p.cor++;p.ms+=a?a.ms:0;if(c.streak&&p.st>=2)bonus=Math.min(500,(p.st-1)*100)}else p.st=0;
  if(c.wett&&ON.bets&&ON.bets[p.id]){bet=right?ON.bets[p.id]:-ON.bets[p.id]}
  const pen=c.pen&&!right&&a?-200:0;const tot=pts+bonus+bet+pen;p.score=Math.max(0,p.score+tot);p.last={right,pts:tot,bonus,bet,pen,none:!a,dbl:p.dbl===ON.qi&&right}});
 let koOut=[],saved=[];if(c.mode==='ko'){const alive=ON.players.filter(p=>!p.out);if(alive.some(p=>p.last&&p.last.right)){alive.filter(p=>!p.last||!p.last.right).forEach(p=>{if(c.jok&&p.jk&&p.jk.shield>0){p.jk.shield--;saved.push(p.id)}else{p.out=true;p.outAt=ON.qi+1;koOut.push(p.id)}})}}
 const after=rankOrder(ON.players).map(p=>p.id);ON.players.forEach(p=>p.mv=before.indexOf(p.id)-after.indexOf(p.id));
 const last=ON.qi>=qTotal()-1||(c.mode==='ko'&&ON.players.length>1&&aliveN()<=1);
 const m={t:'rev',i:ON.qi,kind:q.type,ok:q.type==='est'?q.ans:q.ok,unit:q.unit||'',info:q.info||'',picks,closest,koOut,saved,last,fin:ON.fin,players:pubPlayers()};hostBroadcast(m);showReveal(m);if(c.auto)ON.auto=setTimeout(hostNext,last?7000:10000)}
function awards(){const pl=ON.players,a=[];const fast=pl.filter(p=>p.cor>0).sort((x,y)=>x.ms/x.cor-y.ms/y.cor)[0];if(fast)a.push(['⚡','Blitzmerker',fast.name,(fast.ms/fast.cor/1000).toFixed(1).replace('.',',')+' s im Schnitt']);

  if(DC.tool==='fill'){const o={k:'f',x,y,c:DC.col};drawApply(o);DC.send&&DC.send({o});return}
  try{el.setPointerCapture(e.pointerId)}catch(_){}DC.down=true;const o={k:'s',c:DC.tool==='erase'?'#ffffff':DC.col,w:DC.tool==='erase'?Math.max(DC.w,26):DC.w,p:[x,y]};drawApply(o);DC.send&&DC.send({o:{k:'s',c:o.c,w:o.w,p:[x,y]}});
  DC.fl=setInterval(drawFlush,70)};

function drawApply(o){if(!o)return;const ops=DC.ops;
 if(o.k==='s'){ops.push({k:'s',c:o.c,w:o.w,p:[...o.p]});drawSeg(ops[ops.length-1],0)}
 else if(o.k==='p'){const s=ops[ops.length-1];if(!s||s.k!=='s')return;const from=s.p.length-2;s.p.push(...o.p);drawSeg(s,from)}
 else if(o.k==='f'){ops.push(o);drawFill(o)}
 else if(o.k==='u'){let i=ops.length-1;while(i>=0&&ops[i].k==='c')i--;if(i>=0){ops.splice(i,1);drawRedraw()}}
 else if(o.k==='c'){ops.push(o);drawRedraw()}}
function drawSeg(s,from){const c=DC.ctx;if(!c)return;const k=DC.el.width/1000;c.strokeStyle=s.c;c.fillStyle=s.c;c.lineWidth=s.w*k;c.lineCap='round';c.lineJoin='round';const p=s.p;
 if(p.length<=2||from<0){c.beginPath();c.arc(p[0]*k,p[1]*k,s.w*k/2,0,Math.PI*2);c.fill();if(p.length<=2)return;from=0}
 c.beginPath();c.moveTo(p[from]*k,p[from+1]*k);for(let i=from+2;i<p.length;i+=2)c.lineTo(p[i]*k,p[i+1]*k);c.stroke()}

function drawFill(o){const c=DC.ctx;if(!c)return;const W=DC.el.width,H=DC.el.height,k=W/1000;const x0=Math.round(o.x*k),y0=Math.round(o.y*k);const img=c.getImageData(0,0,W,H),d=img.data;
 const i0=(y0*W+x0)*4;const tr=d[i0],tg=d[i0+1],tb=d[i0+2];const col=parseInt(o.c.slice(1),16);const R=col>>16&255,Gc=col>>8&255,B=col&255;if(Math.abs(tr-R)+Math.abs(tg-Gc)+Math.abs(tb-B)<10)return;
 const same=j=>Math.abs(d[j]-tr)+Math.abs(d[j+1]-tg)+Math.abs(d[j+2]-tb)<90;const st=[x0,y0];const seen=new Uint8Array(W*H);
 while(st.length){const y=st.pop(),x=st.pop();let xl=x;while(xl>=0&&!seen[y*W+xl]&&same((y*W+xl)*4))xl--;xl++;let xr=x;while(xr<W&&!seen[y*W+xr]&&same((y*W+xr)*4))xr++;
  for(let i=xl;i<xr;i++){const j=y*W+i;seen[j]=1;d[j*4]=R;d[j*4+1]=Gc;d[j*4+2]=B;d[j*4+3]=255;if(y>0&&!seen[j-W]&&same((j-W)*4))st.push(i,y-1);if(y<H-1&&!seen[j+W]&&same((j+W)*4))st.push(i,y+1)}}
 c.putImageData(img,0,0)}
